<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Daybook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bar:#c2417a;--hb:#23272b;--bg:#fbf7f6;--ink:#1d2327;--mut:#6b7378;--line:#dcdad2;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#14161a;--ink:#ecebe6;--mut:#9aa0a6;--line:#2c3036;--card:#1f2226;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;background:var(--bg)}
header{background:var(--hb);color:#fff;padding:10px 12px;border-bottom:3px solid var(--bar)}header h1{margin:0;font-size:18px}
.row{display:flex;align-items:center;gap:6px}.sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--card);color:var(--ink)}
header button{background:rgba(255,255,255,.18);color:#fff;padding:6px 10px}header button.on{background:#fff;color:var(--bar)}
main{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;position:relative}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}nav button{flex:1;border-radius:0;background:none;padding:10px 0;font-size:12px;color:var(--mut)}nav button.on{color:var(--bar);font-weight:700}
#fab{position:fixed;right:max(18px,calc(50% - 430px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--bar);color:#fff;font-size:30px;padding:0;box-shadow:0 3px 10px #0004;z-index:5}
.tl{position:relative;margin:8px 8px 90px 0}.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}.hr span{position:absolute;left:4px;top:-8px;background:var(--bg);padding:0 2px;width:46px}
.ev{position:absolute;border-radius:6px;padding:2px 24px 2px 8px;color:var(--ink);font-size:12.5px;line-height:1.2;overflow:hidden;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s;border-left:4px solid #0003}
.ev.sh{white-space:nowrap;text-overflow:ellipsis}.ev.sh b{overflow:hidden;text-overflow:ellipsis}
.ev.lift{box-shadow:0 6px 16px #0006;z-index:6;transform:scale(1.02)}
.ev b{font-weight:600}.rz{touch-action:none;position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;background:linear-gradient(#0000,#0004)}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--bar);z-index:3}
.week{display:grid;grid-template-columns:44px repeat(7,1fr);gap:0}.wh{text-align:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}.wh.t{color:var(--bar);font-weight:700}
.wc{position:relative;border-left:1px solid var(--line)}.wc .ev{left:1px;right:1px;font-size:10px;padding:1px 3px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);margin:8px}.mc{background:var(--card);min-height:70px;padding:3px;font-size:11px;cursor:pointer;overflow:hidden}.mc.o{opacity:.45}.mc.t .d{background:var(--bar);color:#fff;border-radius:10px;padding:0 5px}
.chip{border-radius:3px;color:#fff;padding:0 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:14px}.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px}.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}.dot{width:10px;height:10px;border-radius:50%;flex:none}
dialog{border:0;border-radius:14px;padding:16px;width:min(420px,94vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0007}
label{display:block;font-size:12px;color:var(--mut);margin-top:8px}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.st{font-style:normal;display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;color:#fff;font-size:11px;margin-right:4px}
#adjbar{background:var(--bar);color:#fff;padding:8px 12px}#adjbar button{background:#fff;color:var(--bar);font-weight:700}
.ev.adj{overflow:visible;z-index:4;outline:3px solid #fff;box-shadow:0 0 0 5px var(--bar)}
.hd{position:absolute;left:22%;right:22%;height:20px;background:#fff;color:#333;border-radius:10px;text-align:center;font-size:12px;line-height:20px;box-shadow:0 1px 5px #0007;touch-action:none;cursor:ns-resize}.hd.t{top:-10px}.hd.b{bottom:-10px}
#tl.am .ev:not(.adj){opacity:.35}
.strip{display:flex;position:sticky;top:0;z-index:7;background:var(--bg);border-bottom:1px solid var(--line)}.sd{flex:1;text-align:center;padding:4px 0;font-size:12px;cursor:pointer;color:var(--mut);line-height:1.25}.sd b{font-size:16px;color:var(--ink)}.sd.we{background:var(--line)}.sd.sel{outline:2px solid var(--bar);outline-offset:-2px}
.vh{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px;pointer-events:none}.ri{position:absolute;right:6px;top:3px}.ri .st{width:18px;height:18px;line-height:18px;margin:0}.now i{position:absolute;left:-46px;top:-9px;font-style:normal;font-size:11px;background:var(--bg);color:var(--bar);padding:0 2px}.wc .now i{display:none}label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}.chk input{width:20px;height:20px}
.err{color:#d33;font-size:13px;min-height:18px}.pri{background:var(--bar);color:#fff}.del{background:#d33;color:#fff}
</style></head><body><div id="app">
<header><div class="row" style="position:relative"><button id="title" aria-label="Pick a date" style="background:none;color:#fff;font-size:20px;font-weight:600;padding:4px 0;text-align:left"></button><span class="sp"></span><button id="today">Today</button><button id="prev">‹</button><button id="next">›</button><input id="jump" class="vh" type="date" aria-label="Go to date"></div>
<div class="row" style="margin-top:6px"><span id="vs"></span></div></header>
<main id="main"></main>
<button id="fab" aria-label="Add activity">+</button>
<div id="vbar" class="row" style="display:none;background:#000;color:#fff;padding:8px 12px"><span class="sp" id="vt"></span><button id="vback" style="background:#fff;color:#000">Back to my day</button></div>
<div id="adjbar" class="row" style="display:none"><span class="sp" id="adjt"></span><button id="adjd">Done</button></div>
<nav id="nav"></nav></div>
<dialog id="dlg"><form id="f" method="dialog" novalidate>
<h3 id="dt" style="margin:0"></h3>
<label>Title<input id="fT" maxlength="80"></label>
<label>Category<select id="fC"></select></label>
<label>Type<select id="fB"></select></label>
<label>Status<select id="fU"><option value="">Not marked</option><option value="yes">Completed</option><option value="early">Completed early</option><option value="no">Not completed</option></select></label>
<label>Date<input id="fD" type="date"></label>
<div class="row"><label class="sp">Start<input id="fS" type="time"></label><label class="sp">End<input id="fE" type="time"></label></div>
<div class="row"><label class="sp">Repeat<select id="fR"><option value="">Does not repeat</option><option value="daily">Every day</option><option value="weekdays">Weekdays (Mon–Fri)</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="custom">Specific days…</option></select></label><label class="sp">Until (optional)<input id="fRu" type="date"></label></div>
<div id="fDw" class="row" style="display:none;flex-wrap:wrap;gap:4px 10px"><label class="chk" style="margin:0"><input type="checkbox" data-d="0">Sun</label><label class="chk" style="margin:0"><input type="checkbox" data-d="1">Mon</label><label class="chk" style="margin:0"><input type="checkbox" data-d="2">Tue</label><label class="chk" style="margin:0"><input type="checkbox" data-d="3">Wed</label><label class="chk" style="margin:0"><input type="checkbox" data-d="4">Thu</label><label class="chk" style="margin:0"><input type="checkbox" data-d="5">Fri</label><label class="chk" style="margin:0"><input type="checkbox" data-d="6">Sat</label></div>
<label>Location (optional)<input id="fL"></label>
<label>Notes<textarea id="fN" rows="2"></textarea></label>
<label>When others view my calendar<select id="fP"><option value="show">Show activity</option><option value="busy">Busy</option><option value="line">Black line</option><option value="hidden">Hidden</option></select></label>
<div class="err" id="err"></div>
<button type="button" id="bA" style="width:100%;margin-bottom:8px;background:var(--bg)">Adjust length in schedule</button>
<button type="button" id="bD2" style="width:100%;margin-bottom:8px;background:var(--bg)">Delete this day only</button>
<div class="row"><button type="button" class="del" id="bD">Delete</button><button type="button" id="bU">Duplicate</button><span class="sp"></span><button type="button" id="bX">Cancel</button><button type="button" class="pri" id="bS">Save</button></div>
</form></dialog>
<dialog id="dlgA"><h3 style="margin:0">Daybook account</h3><label>Email<input id="aE" type="email" autocomplete="email"></label><label>Password (6+ characters)<input id="aP" type="password" autocomplete="current-password"></label><div class="err" id="aM"></div><div class="row"><button type="button" id="aOff">Not now</button><span class="sp"></span><button type="button" id="aUp">Sign up</button><button type="button" class="pri" id="aIn">Sign in</button></div></dialog>
<dialog id="dlgT"><h3 id="tt" style="margin:0">New task</h3>
<label>Task<input id="tT" maxlength="80"></label>
<label>Due date<input id="tD" type="date"></label>
<label>Category<select id="tC"></select></label>
<label>Status<select id="tU"><option value="">Not marked</option><option value="yes">Completed</option><option value="early">Completed early</option><option value="no">Not completed</option></select></label>
<div class="row"><label class="sp">Repeat<select id="tRp"><option value="">Does not repeat</option><option value="daily">Every day</option><option value="weekdays">Weekdays (Mon–Fri)</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></label><label class="sp">Until (optional)<input id="tRu" type="date"></label></div>
<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="tS" style="width:20px;height:20px"> Also put it in my schedule</label>
<div class="row" id="tR" style="display:none"><label class="sp">Start<input id="tA" type="time"></label><label class="sp">End<input id="tB" type="time"></label></div>
<label>Notes<textarea id="tN" rows="2"></textarea></label>
<div class="err" id="tE"></div>
<div class="row"><button type="button" class="del" id="tDel">Delete</button><span class="sp"></span><button type="button" id="tX">Cancel</button><button type="button" class="pri" id="tSv">Save</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CATS=[["Work","#3a6ea5"],["Personal","#8a5fb0"],["Meals","#d9822b"],["Appointments","#c0392b"],["Exercise","#2e9e5b"],["Family","#d6568c"],["Social","#e0b020"],["School","#4a9fb5"],["Travel","#6d7a3a"],["Other","#7b8794"]];
const SK="daybook.settings.v1",DEF={theme:"dark",acc:"#c2417a",bar:"#23272b",op:28,bw:5,rad:4,h:72,t24:false,showT:true,cols:{}};
let SET=Object.assign({},DEF,{cols:{}}),H=72;
try{Object.assign(SET,JSON.parse(localStorage.getItem(SK))||{})}catch(e){}
function applySet(){const r=document.documentElement;r.dataset.theme=SET.theme;r.style.setProperty("--bar",SET.acc);r.style.setProperty("--hb",SET.bar);H=SET.h}
const saveSet=()=>{try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}};
const AH=()=>Math.round(SET.op/100*255).toString(16).padStart(2,"0");
applySet();
const col=n=>n==="__line"?"#000":SET.cols[n]||(CATS.find(c=>c[0]===n)||CATS[9])[1];
const SUBS={Work:["Meeting","Project","Call","Admin","N/A"],Personal:["Errand","Self-care","Chores","Planning","N/A"],Meals:["Breakfast","Lunch","Dinner","Snack","N/A"],Appointments:["Medical","Dental","Business","Personal","N/A"],Exercise:["Gym","Run","Sport","Walk","N/A"],Family:["Date","Kids","Visit","Event","N/A"],Social:["Friends","Party","Outing","Call","N/A"],School:["Class","Homework","Exam","Study","N/A"],Travel:["Work","College","Pleasure","N/A"],Other:["N/A"]};
function moveNow(e){const n=new Date(),len=Math.max(15,(e.end-e.start)||30);e.date=iso(n);if(e.sched!==false){const s=Math.min(1440-len,n.getHours()*60+n.getMinutes());e.start=s;e.end=s+len}}
const isDone=e=>e.done==="yes"||e.done==="early";
const isFuture=e=>{const n=new Date();return e.date>iso(n)||(e.date===iso(n)&&e.sched!==false&&e.start>n.getHours()*60+n.getMinutes())};
const st=e=>e.done==="early"?'<i class="st" style="background:#1f8f9a" title="Completed early">✓</i>':e.done==="yes"?'<i class="st" style="background:#2e9e5b">✓</i>':e.done==="no"?'<i class="st" style="background:#d33">⊘</i>':e.kind==="task"?"☐ ":"";
function adjTxt(){const a=S.events.find(x=>x.id===S.adj);if(a)$("adjt").textContent=a.title+" · "+f12(a.start)+"–"+f12(a.end)+" ("+(a.end-a.start)+" min)"}
function fillSub(c,s){const l=SUBS[c]||["N/A"];$("fB").innerHTML=l.map(x=>`<option>${x}</option>`).join("");$("fB").value=l.includes(s)?s:"N/A"}
const K="daybook.events.v1";let S={events:[],view:"day",page:"calendar",date:new Date()};
const load=()=>{try{S.events=JSON.parse(localStorage.getItem(K))||[]}catch(e){S.events=[]}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S.events))}catch(e){}schedSync()};
const $=id=>document.getElementById(id),iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const tm=m=>{m=Math.min(m,1439);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const pm=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const f12=m=>{if(SET.t24)return tm(m);let h=Math.floor(m/60),x=h>=12?"p":"a";h=h%12||12;return h+(m%60?":"+String(m%60).padStart(2,"0"):"")+x};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const on=(d)=>EV().filter(e=>occurs(e,d)).map(e=>e.rep?Object.assign({},e,{date:iso(d),done:dOf(e,iso(d))}):e).sort((a,b)=>a.start-b.start);
function occurs(e,d,any){const k=iso(d);if(e.sched===false&&!any)return false;if(!e.rep)return e.date===k;if(k<e.date||(e.until&&k>e.until)||(e.skip||[]).includes(k))return false;const b=fromIso(e.date);if(e.rep==="daily")return true;if(e.rep==="weekdays")return d.getDay()%6!==0;if(e.rep==="weekly")return d.getDay()===b.getDay();if(e.rep==="custom")return(e.days||[]).includes(d.getDay());if(e.rep==="monthly")return d.getDate()===b.getDate();return false}
const NAV=[["home","Home"],["calendar","Calendar"],["people","People"],["map","Map"],["more","More"]];
function render(){
 if(S.adj){const a=S.events.find(x=>x.id===S.adj);if(!a||!occurs(a,S.date)||S.page!=="calendar"||S.view!=="day")S.adj=null}$("vbar").style.display=VIEWING?"flex":"none";if(VIEWING)$("vt").textContent="Viewing "+VIEWING.name+"'s calendar · read-only";$("adjbar").style.display=S.adj?"flex":"none";if(S.adj)adjTxt();else $("main")._a=null;
 $("nav").innerHTML=NAV.map(n=>`<button class="${S.page===n[0]?"on":""}" data-p="${n[0]}">${n[1]}</button>`).join("");
 const cal=S.page==="calendar";$("fab").style.display=(cal||S.page==="home")&&!S.adj&&!VIEWING?"":"none";
 $("vs").innerHTML=cal?["day","week","month"].map(v=>`<button class="${S.view===v?"on":""}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join(" "):"";
 const d=S.date,M=$("main");
 $("title").textContent=cal?(S.view==="month"?d.toLocaleDateString(undefined,{month:"long",year:"numeric"}):S.view==="week"?"Week of "+addD(d,-d.getDay()).toLocaleDateString(undefined,{month:"short",day:"numeric"}):d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})):NAV.find(n=>n[0]===S.page)[1];
 if(cal)$("title").textContent+=" ▾";
 ["today","prev","next","jump"].forEach(i=>$(i).style.display=cal?"":"none");$("jump").value=iso(S.date);
 if(S.page==="calendar")M.innerHTML=S.view==="day"?dayV():S.view==="week"?weekV():monthV();
 else if(S.page==="home")M.innerHTML=homeV();
 else M.innerHTML=S.page==="more"?setV():S.page==="people"?peopleV():stub();
 if(cal&&S.view!=="month"&&!M._s){M.scrollTop=H*7;M._s=1}
 if(S.adj&&M._a!==S.adj){const a=S.events.find(x=>x.id===S.adj);if(a){M.scrollTop=Math.max(0,a.start/60*H-140);M._a=S.adj}}
 if(S.page!=="calendar")M._s=0;
}
function grid(){let h="";for(let i=0;i<24;i++)h+=`<div class="hr" style="top:${i*H}px"><span>${f12(i*60)}</span></div>`;return h}
function lay(list){const out=[];let cl=[],end=0;const flush=()=>{const n=Math.max(1,...cl.map(x=>x[1]+1));cl.forEach(x=>out.push([x[0],x[1],n]));cl=[]};
 for(const e of list){if(cl.length&&e.start>=end)flush();const used=cl.filter(x=>x[0].end>e.start).map(x=>x[1]);let c=0;while(used.includes(c))c++;cl.push([e,c]);end=cl.length===1?e.end:Math.max(end,e.end)}
 flush();return out}
function evBlock(e,small,c=0,n=1){const t=e.start/60*H,hh=Math.max((e.end-e.start)/60*H,18);
 return `<div class="ev${S.adj===e.id?" adj":""}${hh<50?" sh":""}" data-id="${e.id}" style="top:${t}px;height:${hh}px;background:${e.cat==="__line"?"#000":col(e.cat)+AH()};border-left:${SET.bw}px solid ${col(e.cat)};border-radius:${SET.rad}px${e.kind==="task"?";outline:2px dashed var(--mut);outline-offset:-4px":""};${small?`left:calc(${c}*100%/${n} + 1px);width:calc(100%/${n} - 2px);right:auto`:`left:calc(54px + (100% - 58px)*${c}/${n});width:calc((100% - 58px)/${n} - 2px);right:auto`}"><b>${esc(e.title)}</b>${small||!SET.showT?"":" "+(e.sub&&e.sub!=="N/A"?esc(e.sub)+" · ":"")+f12(e.start)+" – "+f12(e.end)+(e.loc?" · "+esc(e.loc):"")}${small?"":`<span class="ri">${e.rep?'<span style="opacity:.7;margin-right:4px">↻</span>':""}${st(e)}</span>`}${small?"":S.adj===e.id?'<div class="hd t">≡</div><div class="hd b">≡</div>':'<div class="rz"></div>'}</div>`}
function nowLine(d){if(iso(d)!==iso(new Date()))return"";const n=new Date();return `<div class="now" style="top:${(n.getHours()*60+n.getMinutes())/60*H}px"><i>${f12(n.getHours()*60+n.getMinutes())}</i></div>`}
function strip(){const s=addD(S.date,-S.date.getDay());let h='<div class="strip">';for(let i=0;i<7;i++){const d=addD(s,i);h+=`<div class="sd${iso(d)===iso(S.date)?" sel":""}${d.getDay()%6===0?" we":""}" data-go="${iso(d)}">${d.toLocaleDateString(undefined,{weekday:"short"})}<br><b>${d.getDate()}</b></div>`}return h+"</div>"}
function dayV(){return strip()+`<div class="tl${S.adj?" am":""}" style="height:${24*H}px" id="tl">${grid()}${lay(on(S.date)).map(([e,c,n])=>evBlock(e,0,c,n)).join("")}${nowLine(S.date)}</div>`}
function weekV(){const s=addD(S.date,-S.date.getDay());let h='<div class="week"><div></div>';
 for(let i=0;i<7;i++){const d=addD(s,i);h+=`<div class="wh ${iso(d)===iso(new Date())?"t":""}" data-go="${iso(d)}">${d.toLocaleDateString(undefined,{weekday:"short"})}<br>${d.getDate()}</div>`}
 h+=`</div><div class="week"><div class="tl" style="height:${24*H}px;margin:0">${Array.from({length:24},(_,i)=>`<div class="hr" style="top:${i*H}px"><span>${f12(i*60)}</span></div>`).join("")}</div>`;
 for(let i=0;i<7;i++){const d=addD(s,i);h+=`<div class="wc" style="height:${24*H}px">${lay(on(d)).map(([e,c,n])=>evBlock(e,1,c,n)).join("")}${nowLine(d).replace("left:46px","")}</div>`}
 return h+"</div>"}
function monthV(){const d=S.date,f=new Date(d.getFullYear(),d.getMonth(),1),s=addD(f,-f.getDay());let h='<div class="mg">';

function schedSync(){if(!sb||!USER)return;try{localStorage.setItem("daybook.dirty","1")}catch(e){}if(!pulled)return;clearTimeout(syncT);syncT=setTimeout(()=>push().then(()=>render()),1200)}
async function push(){if(!sb||!USER||!pulled)return;try{S.events.forEach(e=>{if(!isUuid(e.id)){if(S.adj===e.id)S.adj=null;e.id=crypto.randomUUID()}});persist();
 const rows=S.events.map(e=>({id:e.id,owner:USER.id,kind:e.kind==="task"?"task":"act",privacy:e.privacy||"show",data:e}));
 if(rows.length){const u=await sb.from("events").upsert(rows);if(u.error)throw u.error}
 const c=await sb.from("events").select("id").eq("owner",USER.id);if(c.error)throw c.error;
 const keep=new Set(S.events.map(e=>e.id)),gone=(c.data||[]).map(x=>x.id).filter(i=>!keep.has(i));
 if(gone.length){const d=await sb.from("events").delete().in("id",gone);if(d.error)throw d.error}
 try{localStorage.removeItem("daybook.dirty")}catch(e){}syncMsg="Synced "+new Date().toLocaleTimeString()}catch(e){syncMsg="Sync problem: "+(e.message||e)}}
async function pull(){const q=await sb.from("events").select("id,data").eq("owner",USER.id);if(q.error)throw q.error;
 const cloud=q.data.map(x=>Object.assign({},x.data,{id:x.id}));
 const ids=new Set(cloud.map(e=>e.id));S.events=cloud.concat(S.events.filter(e=>!ids.has(e.id)&&!isUuid(e.id)));persist()}
async function sync0(){try{let key="daybook.synced."+USER.id,first=true,dirty=false;try{first=!localStorage.getItem(key);dirty=!!localStorage.getItem("daybook.dirty")}catch(e){}
 if(first||!dirty)await pull();else if(false){}
 pulled=true;try{localStorage.setItem(key,"1")}catch(e){}await push()}catch(e){syncMsg="Sync problem: "+(e.message||e)}render()}
async function loadPeople(){if(!sb||!USER)return;try{const [o,i]=await Promise.all([sb.from("calendar_shares").select("viewer").eq("owner",USER.id),sb.from("calendar_shares").select("owner").eq("viewer",USER.id)]);
 const ids=[...new Set([...(o.data||[]).map(x=>x.viewer),...(i.data||[]).map(x=>x.owner)])];const nm={};
 if(ids.length){const p=await sb.from("profiles").select("id,email,display_name").in("id",ids);(p.data||[]).forEach(x=>nm[x.id]=x)}
 PEOPLE={out:(o.data||[]).map(x=>nm[x.viewer]||{id:x.viewer,email:"unknown"}),inn:(i.data||[]).map(x=>nm[x.owner]||{id:x.owner,email:"unknown"})}}catch(e){}if(S.page==="people")render()}
async function viewCal(id,name){const q=await sb.rpc("shared_events",{p_owner:id});if(q.error){alert(q.error.message);return}
 VIEWING={id,name,events:q.data.map(x=>Object.assign({},x.data,{id:x.id,privacy:x.privacy,cat:x.privacy==="line"?"__line":(x.data.cat||"Other")}))};S.page="calendar";S.view="day";S.date=new Date();render()}
function peopleV(){if(!sb)return '<div class="pad"><div class="card">Cloud features could not load. Check your internet connection and reload.</div></div>';
 if(!USER)return '<div class="pad"><div class="card"><h3 style="margin-top:0">People</h3><p>Sign in to share your calendar and see calendars shared with you.</p><button class="pri" id="openAuth">Sign in / Sign up</button></div></div>';
 const nm=p=>esc(p.display_name||p.email);
 return `<div class="pad"><div class="card"><h3 style="margin-top:0">Share my calendar</h3><label>Friend's email (they need a Daybook account first)<input id="shEmail" type="email"></label><button class="pri" id="shBtn" style="margin-top:8px">Share (view only)</button><div class="err" id="shMsg"></div></div>
<div class="card"><h3 style="margin-top:0">Calendars shared with me</h3>${PEOPLE.inn.length?PEOPLE.inn.map(p=>`<div class="li"><span class="sp">${nm(p)}</span><button data-view="${p.id}" data-name="${nm(p)}">View</button></div>`).join(""):"Nobody has shared a calendar with you yet."}</div>
<div class="card"><h3 style="margin-top:0">People I share with</h3>${PEOPLE.out.length?PEOPLE.out.map(p=>`<div class="li"><span class="sp">${nm(p)}</span><button data-rm="${p.id}">Remove</button></div>`).join(""):"You haven't shared your calendar yet."}</div></div>`}
function acctV(){return USER?`<h3 style="margin-top:0">Account</h3><p>Signed in as ${esc(USER.email)}</p><p style="color:var(--mut);font-size:12px">${esc(syncMsg||"Syncing...")}</p><button id="soBtn">Sign out</button>`:'<h3 style="margin-top:0">Account</h3><p>Not signed in. Activities are saved only on this device.</p><button class="pri" id="openAuth">Sign in / Sign up</button>'}
const aMsg=m=>{$("aM").textContent=m};
$("aIn").onclick=async()=>{aMsg("");if(!sb)return aMsg("Cloud not available.");const q=await sb.auth.signInWithPassword({email:$("aE").value.trim(),password:$("aP").value});if(q.error)aMsg(q.error.message)};
$("aUp").onclick=async()=>{aMsg("");if(!sb)return aMsg("Cloud not available.");const q=await sb.auth.signUp({email:$("aE").value.trim(),password:$("aP").value});if(q.error)aMsg(q.error.message);else if(!q.data.session)aMsg("Check your email to confirm your account, then sign in.")};
$("aOff").onclick=()=>{try{localStorage.setItem("daybook.offline","1")}catch(e){}$("dlgA").close()};
$("vback").onclick=()=>{VIEWING=null;render()};
document.addEventListener("click",async ev=>{const t=ev.target;if(!sb||!t.dataset)return;
 if(t.id==="openAuth")$("dlgA").showModal();
 else if(t.id==="soBtn"){await push();await sb.auth.signOut();S.events=[];persist();pulled=false;render()}
 else if(t.id==="shBtn"){const q=await sb.rpc("share_calendar",{p_email:$("shEmail").value,p_can_edit:false});await loadPeople();const m=$("shMsg");if(m)m.textContent=q.error?q.error.message:q.data}
 else if(t.dataset.view)viewCal(t.dataset.view,t.dataset.name);
 else if(t.dataset.rm){await sb.from("calendar_shares").delete().eq("owner",USER.id).eq("viewer",t.dataset.rm);loadPeople()}});
(async()=>{if(!sb)return;sb.auth.onAuthStateChange((ev,ss)=>{USER=ss?ss.user:null;if(USER){if($("dlgA").open)$("dlgA").close();setTimeout(sync0,0)}else{pulled=false;VIEWING=null;render()}});
 const g=await sb.auth.getSession();let off=false;try{off=!!localStorage.getItem("daybook.offline")}catch(e){}if(!g.data.session&&!off)$("dlgA").showModal()})();
load();render();setInterval(()=>{if(S.page==="calendar"&&S.view!=="month"&&!$("dlg").open&&!dr)render()},60000);
</script></body></html>
